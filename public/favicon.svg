<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #38BDF8); }
      }
      @keyframes dashRotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 120; }
      }

      .outer-orbit {
        transform-origin: 32px 32px;
        animation: spinClockwise 8s linear infinite;
      }
      .inner-orbit {
        transform-origin: 32px 32px;
        animation: spinCounter 5s linear infinite;
      }
      .core-pulse {
        transform-origin: 32px 32px;
        animation: pulseScale 2.5s ease-in-out infinite;
      }
      .dashed-ring {
        animation: dashRotate 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Dark Shield Base Background -->
  <rect width="64" height="64" rx="18" fill="#090D16" />
  <rect width="64" height="64" rx="18" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Outer Orbit Ring with Dashed Laser Path -->
  <g class="outer-orbit">
    <circle cx="32" cy="32" r="22" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" class="dashed-ring" />
    <circle cx="32" cy="10" r="3" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="54" cy="32" r="2.5" fill="#A855F7" />
    <circle cx="10" cy="32" r="2.5" fill="#6366F1" />
  </g>

  <!-- Inner Orbit Ring -->
  <g class="inner-orbit">
    <circle cx="32" cy="32" r="14" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7" />
    <circle cx="32" cy="18" r="2.2" fill="#22D3EE" filter="url(#glow)" />
    <circle cx="32" cy="46" r="2.2" fill="#F43F5E" />
  </g>

  <!-- Central Synaptic Glowing Nucleus -->
  <g class="core-pulse">
    <!-- Outer Aura -->
    <circle cx="32" cy="32" r="7.5" fill="url(#coreGlow)" opacity="0.35" filter="url(#glow)" />
    <!-- Core Diamond/Hex Shape -->
    <polygon points="32,26 37.5,29.5 37.5,34.5 32,38 26.5,34.5 26.5,29.5" fill="url(#cyberGrad)" />
    <!-- Inner Radiant Spark -->
    <circle cx="32" cy="32" r="2.2" fill="#FFFFFF" filter="url(#glow)" />
  </g>
</svg>